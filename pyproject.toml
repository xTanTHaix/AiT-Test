[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ait-test"
version = "1.0.0"
description = "High-assurance static invariant, causation and concurrency diagnostic engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AiT-test" }]
keywords = ["static-analysis", "ast", "concurrency", "deadlock", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
ait = "ait.cli:main"
ait-mcp = "ait.mcp:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
# tests/fixtures are deliberately defective samples; docs holds generated assets.
extend-exclude = ["tests/fixtures", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests", "docs", "build", "dist", ".onyxsi", ".benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "--strict-markers"
